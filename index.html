<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b0c16"><title>Theta Tau Practice Test</title>
  <style>
    :root{--red:#650d1b;--red2:#8c1729;--gold:#d5a929;--ink:#211e1d;--soft:#fbf7ef;--line:#e9dfc9;--good:#176b42;--bad:#9d1c2a}*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 90% 0,#f4df9b 0,transparent 27rem),var(--soft);min-height:100vh}.wrap{max-width:680px;margin:auto;padding:26px 18px 46px}.mast{display:flex;align-items:center;gap:13px;margin-bottom:32px}.crest{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:var(--gold);font-size:22px;border:3px solid var(--gold);box-shadow:0 2px 8px #0002}.mast h1{font-family:Georgia,serif;font-size:1.35rem;margin:0;color:var(--red)}.mast p{margin:2px 0 0;font-size:.82rem;color:#73695e}.progress-row{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;color:var(--red);margin:0 2px 8px}.bar{height:8px;background:#eadfca;border-radius:99px;overflow:hidden;margin-bottom:24px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:99px;transition:width .35s}.card{background:#fffdf9;border:1px solid var(--line);border-radius:20px;padding:27px;box-shadow:0 10px 28px #4d2a0712}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:#9d7a16;font-weight:800;font-size:.72rem;margin:0 0 9px}.question{font-family:Georgia,serif;font-size:1.6rem;line-height:1.23;margin:0 0 21px;color:var(--red)}.hint{margin:-12px 0 16px;color:#726a61;font-size:.9rem;line-height:1.45}.field{display:flex;gap:9px}.field input{min-width:0;flex:1;padding:14px 15px;border:2px solid #d8ccba;border-radius:11px;font:inherit;font-size:16px;outline:none;background:white}.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d5a92925}button{border:0;border-radius:11px;padding:14px 16px;background:var(--red);color:white;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}button:hover{background:var(--red2)}.feedback{min-height:48px;margin-top:16px;padding:12px 14px;border-radius:10px;line-height:1.35;font-size:.92rem}.feedback:empty{display:none}.good{background:#e8f5eb;color:var(--good)}.bad{background:#fae9eb;color:var(--bad)}.answers{margin:15px 0 0;padding-left:20px;color:#544c43;font-size:.93rem;line-height:1.65}.answer-count{font-size:.83rem;color:#766d63;margin:0 0 12px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:23px}.link{background:transparent;color:#7e6754;padding:8px;text-decoration:underline;font-size:.86rem}.link:hover{background:transparent;color:var(--red)}.finish{text-align:center;padding:18px 0 7px}.finish .big{font-size:3rem}.finish h2{font-family:Georgia,serif;color:var(--red);font-size:2rem;margin:10px 0}.finish p{line-height:1.5;color:#5e554b}.restart{margin-top:13px;background:var(--gold);color:#382700}@media(max-width:460px){.wrap{padding:18px 13px 36px}.card{padding:21px 17px}.question{font-size:1.4rem}.field{flex-direction:column}.field button{width:100%}}
  </style>
</head>
<body><main class="wrap"><header class="mast"><div class="crest">ΘΤ</div><div><h1>Theta Tau Practice Test</h1><p>Zeta Delta • Study one question at a time</p></div></header><div id="app"></div></main>
<script>
const exact=(answer)=>({type:'exact',answer});
const q=[
 ['Purpose','What is the purpose of Theta Tau?',exact('The purpose of Theta Tau is to develop and maintain a high standard of professional interest among its members, and to unite them in a strong bond of fraternal fellowship.')],
 ['Colors','Theta Tau colors are ___ and ___.',exact('Dark Red and Gold')],['Original name','What is the original name?',exact('Society of Hammer and Tongs')],['Founding date','What is the date of founding?',exact('October 15, 1904')],
 ['Founders','Name all the founders, in order. Include an asterisk if deceased.',{type:'ordered',answers:['Erich J. Schrader*','William M. Lewis*','Elwin L. Vinal*','Isaac B. Hanks*']}],
 ['Founding location','What is the location of founding?',exact('University of Minnesota, Minneapolis, Minnesota')],['Gem','What is the gem of Theta Tau?',exact('Dark Red Garnet')],['Grand Regent','Who is the Grand Regent?',exact('David Parker (Lambda Gamma 2015)')],['Regional directors','Who are the Regional Directors?',exact('Kathryn Cogar, Jose Villa')],
 ['Prohibited fraternities','Name any four prohibited fraternities.',{type:'collection',need:4,items:['Alpha Rho Chi','Alpha Omega Epsilon','Alpha Sigma Kappa','Kappa Eta Kappa','Phi Sigma Kappa','Sigma Rho','Sigma Phi Delta','Triangle','Kappa Theta Pi']}],
 ['Motto','What is the motto of Theta Tau?',exact('Whatsoever thy hand findeth to do, do it with thy might. Ecclesiastes 9:10')],
 ['Regional chapters','Name any five chapters in our region and their location.',{type:'collection',need:5,items:['Mu - University of Alabama','Rho - North Carolina State University','Kappa Beta - Mississippi State University','Lambda Gamma - Clemson University','Omega Delta - Christian Brothers University','Chi Gamma - University of Tennessee','Iota Epsilon - University of Georgia','Iota Delta - Vanderbilt University','Nu Epsilon - Tulane University']}],
 ['Designation',"What is our chapter's designation?",exact('Zeta Delta')],['Colonization','When was our chapter colonized?',exact('Spring 2009')],['Installation','When was our chapter installed?',exact('Saturday, February 5, 2011')],
 ['Past Regents','Name all past Regents in order.',{type:'ordered',answers:['Emily Berger','David Boyer','Cristina Kubicki','Garrett Fullerton','Garrett Hunt','Brad Harris','Sarah Long','Jocelyn Mackay','Ryan Pubentz','Scott Miller','Jared Leone','Jacob Baltzegar','Kyler Storr','John Cooley','Michael Gallagher','Lauren Speck','Jack Oberman','Shannon DePratter','Grace Yaegel']}],
 ['Region','What region are we in?',exact('Southeast')],['Flower','What is the flower of Theta Tau?',exact('Dark Red Rose, Jacqueminot')],
 ['Executive board','Name the executive board, in order.',{type:'ordered',answers:['Regent - Jack Schmitt','Vice Regent - Nicole Hoeker','Marshal - Michelle Elston and Samantha Looney','Standards - Austin Braiewa','Corresponding Secretary - Carlos Arenas','Treasurer - Dawson DePratter','Scribe - Erin Check']}]
];
let n=0, entered=[];const app=document.querySelector('#app');
function state(){return q[n][2]}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(n===q.length){app.innerHTML=`<section class="card finish"><div class="big">✦</div><h2>You completed it!</h2><p>You made it through all ${q.length} Theta Tau practice questions.</p><button class="restart" onclick="restart()">Practice again</button></section>`;return}const [cat,question,s]=q[n];let detail='';if(s.type==='ordered') detail=`<p class="hint">Name ${entered.length+1} of ${s.answers.length}.</p>`;if(s.type==='collection')detail=`<p class="answer-count">${entered.length} of ${s.need} correct answers entered</p>`;app.innerHTML=`<div class="progress-row"><span>QUESTION ${n+1} OF ${q.length}</span><span>${Math.round(n/q.length*100)}%</span></div><div class="bar"><i style="width:${n/q.length*100}%"></i></div><section class="card"><p class="eyebrow">${cat}</p><h2 class="question">${question}</h2>${detail}<form id="form" class="field"><input id="answer" autocomplete="off" autocapitalize="words" placeholder="Type your answer" autofocus><button>Check answer</button></form><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button type="button" class="link" onclick="restart()">Restart test</button><span></span></div></section>`;document.querySelector('#form').addEventListener('submit',check)}
function next(){n++;entered=[];render()}function feedback(msg,good){const f=document.querySelector('#feedback');f.className='feedback '+(good?'good':'bad');f.innerHTML=msg}
function check(e){e.preventDefault();const input=document.querySelector('#answer'),v=input.value.trim(),s=state();if(!v)return;if(s.type==='exact'){if(v===s.answer){feedback('Correct! Moving to the next question…',true);setTimeout(next,600)}else feedback(`Not quite. The correct answer is:<br><strong>${esc(s.answer)}</strong>`,false)}else if(s.type==='ordered'){let needed=s.answers[entered.length];if(v===needed){entered.push(v);if(entered.length===s.answers.length){feedback('Correct! You got the whole list.',true);setTimeout(next,650)}else{feedback('Correct! Keep going.',true);input.value='';render()}}else feedback(`Not quite. The next correct answer is:<br><strong>${esc(needed)}</strong>`,false)}else{if(!s.items.includes(v))feedback('That one isn’t on the accepted list. Try another.',false);else if(entered.includes(v))feedback('You already entered that one — try another.',false);else{entered.push(v);if(entered.length>=s.need){feedback(`Correct! You named ${s.need}. Moving on…`,true);setTimeout(next,650)}else{feedback('Correct! Add another.',true);input.value='';render()}}}input.select()}
function restart(){n=0;entered=[];render()}render();
</script></body></html>
